name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Typecheck edge functions (deno)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          for f in supabase/functions/*/index.ts; do
            echo "deno check $f"
            deno check "$f" || exit 1
          done
